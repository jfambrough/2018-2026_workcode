<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <style>
      /* Container that holds all the line sheets */
      .line-sheets-wrapper {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }

      /* Style for individual line sheet containers */
      .line-sheet-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 48%; /* Two per row */
        margin-bottom: 20px;
        text-align: center;
      }

      .pdf-container {
        display: block;
        text-align: center;
      }

      .pdf-container > iframe {
        margin: 20px;
        width: 100%;
        height: 75%;
        text-align: center;
      }

      .download-button-container {
        margin-bottom: 20px;
      }

      .download-button-container > a {
        text-decoration: none;
        padding: 12px 25px;
        background: black;
        color: white;
        border: none;
        display: inline-block;
      }

      /* Media query to stack everything in one column on mobile */
      @media (max-width: 768px) {
        .line-sheet-container {
          width: 100%; /* Full width on mobile */
        }
      }
    </style>
  </head>
