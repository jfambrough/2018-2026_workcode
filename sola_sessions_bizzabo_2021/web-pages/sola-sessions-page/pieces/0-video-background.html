<style>
	.bg-video {
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100vw;
	  height: 100vh;
	  overflow: hidden;
	  z-index: -1;
	}

	.bg-video #player {
	  position: absolute;
	  top: 0;
	  left: 0;
	  width: 100vw;
	  height: 100vh;
	  z-index: -2;
	}

	.bg-video .overlay {
	  position: absolute;
	  top: 0;
	  left: 0;
	  width: 100vw;
	  height: 100vh;
	  z-index: 1;
	}

</style>

<div class="bg-video">
  <div class="overlay"></div>
  <div id="player"></div>
</div>





<script>
	// Loads the YouTube IFrame API JavaScript code.
	var tag = document.createElement("script")
	tag.src = "https://www.youtube.com/iframe_api"
	// Inserts YouTube JS code into the page.
	var firstScriptTag = document.getElementsByTagName("script")[0]
	firstScriptTag.parentNode.insertBefore(tag, firstScriptTag)

	var player

	// onYouTubeIframeAPIReady() is called when the IFrame API is ready to go.
	function onYouTubeIframeAPIReady() {
	  player = new YT.Player("player", {
	    videoId: "J2jadlIwvao", // the ID of the video
	    playerVars: {
	      autoplay: 1, // start automatically
	      controls: 0, // don't show the controls (we can't click them anyways)
	      modestbranding: 1, // show smaller logo
	      loop: 1, // loop when complete
	      playlist: "J2jadlIwvao" // required for looping, matches the video ID
	    }
	  })
	}
</script>
